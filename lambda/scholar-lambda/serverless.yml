service: scholar-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    SCHOLAR_USER_ID: ${env:SCHOLAR_USER_ID}
  iamRoleStatements:
    - Sid: S3DataAccess
      Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
      Resource: arn:aws:s3:::shervn-blog-media/*

functions:
  api:
    handler: index.handler
    timeout: 10
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true
  # No trigger of its own: invoked directly (async) by blog-admin-lambda's
  # Telegram bot via lambda:InvokeFunction when the /scholarrefresh command
  # is used. Long timeout since it scrapes every paper's own detail page.
  refresh:
    handler: refresh.handler
    timeout: 300
